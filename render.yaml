services:
  - type: web
    name: vibearc
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECURE_COOKIES
        value: "1"
      - key: AUTO_SEED
        value: "1"
      # Persistent saves: create these after running `npm run backup:init`
      - key: BACKUP_REPO
        sync: false
      - key: BACKUP_TOKEN
        sync: false
