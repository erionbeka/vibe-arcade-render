<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload a game — Vibe Arcade</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="logo" href="/">VIBE ARCADE</a>
    <div class="nav-spacer"></div>
    <div id="nav-auth" style="display:flex;gap:14px;align-items:center"></div>
  </div>
</nav>

<div class="form-page">
  <div class="form-card">
    <h2>Upload your game</h2>
    <p class="sub">Ship it! Web games play right in the browser; zips also keep a downloadable source.</p>

    <div class="form-error" id="error"></div>

    <form id="upload-form">
      <div class="field">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" maxlength="100" required placeholder="Neon Snake Deluxe">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="5000"
          placeholder="What is it? Controls? Made with which AI/prompt vibes?"></textarea>
      </div>

      <div class="field">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" name="tags" placeholder="arcade, snake, retro">
        <div class="hint">Up to 8 tags. Letters, numbers and dashes.</div>
      </div>

      <div class="field">
        <label>Type</label>
        <div class="radio-row">
          <label class="radio-card selected" id="rc-web">
            <input type="radio" name="type" value="web" checked>
            <span>&#9654; Playable web game</span>
            <small>.zip with index.html or single .html</small>
          </label>
          <label class="radio-card" id="rc-download">
            <input type="radio" name="type" value="download">
            <span>&#128190; Downloadable build</span>
            <small>any .zip people run locally</small>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="file">Game file * (.zip up to 60 MB, or .html)</label>
        <input type="file" id="file" name="file" accept=".zip,.html,.htm" required>
      </div>

      <div class="field">
        <label for="screenshot">Screenshot (optional)</label>
        <input type="file" id="screenshot" name="screenshot" accept=".png,.jpg,.jpeg,.webp,.gif">
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%">Publish game</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/upload.js"></script>
</body>
</html>
