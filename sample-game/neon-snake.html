<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Snake</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;color:#eaeaf5;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  canvas{border:1px solid #2a2a45;border-radius:10px;background:#12121f}
  h1{font-size:1.1rem;margin:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#9a9ab8;margin:0;font-size:.85rem}
</style>
</head>
<body>
<h1>NEON SNAKE — sample game</h1>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrow keys or WASD to move. Eat the glowing food!</p>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const S = 20, N = 20;
let snake = [{x:10,y:10}], dir = {x:1,y:0}, food = spawn(), score = 0, dead = false;
function spawn(){ let f; do { f = {x:~~(Math.random()*N), y:~~(Math.random()*N)}; } while (snake.some(s=>s.x===f.x&&s.y===f.y)); return f; }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k==='arrowup'||k==='w') && dir.y!==1) dir={x:0,y:-1};
  if ((k==='arrowdown'||k==='s') && dir.y!==-1) dir={x:0,y:1};
  if ((k==='arrowleft'||k==='a') && dir.x!==1) dir={x:-1,y:0};
  if ((k==='arrowright'||k==='d') && dir.x!==-1) dir={x:1,y:0};
});
setInterval(() => {
  if (dead) return;
  const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
  if (snake.some(s=>s.x===h.x&&s.y===h.y)) { dead=true; setTimeout(()=>{snake=[{x:10,y:10}];dir={x:1,y:0};score=0;dead=false;},900); }
  else {
    snake.unshift(h);
    if (h.x===food.x&&h.y===food.y){score++;food=spawn();} else snake.pop();
  }
  x.clearRect(0,0,c.width,c.height);
  x.fillStyle='#22d3ee'; x.shadowColor='#22d3ee'; x.shadowBlur=12;
  x.fillRect(food.x*S+5, food.y*S+5, S-10, S-10);
  x.fillStyle='#8b5cf6'; x.shadowColor='#8b5cf6';
  snake.forEach((s,i)=>x.fillRect(s.x*S+2, s.y*S+2, S-4, S-4));
  x.shadowBlur=0; x.fillStyle='#9a9ab8'; x.font='13px sans-serif';
  x.fillText('Score: '+score+(dead?'  — Game Over! Press a key...':''), 10, 18);
}, 100);
</script>
</body>
</html>
