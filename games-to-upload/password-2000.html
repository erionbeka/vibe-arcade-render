<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PASSWORD CREATOR 2000</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  h1{font-size:.95rem;color:#58a6ff;margin:0}
  input{width:min(520px,92vw);padding:12px;background:#010409;border:3px solid #30363d;color:#fff;font-family:inherit;font-size:1rem;outline:none}
  input:focus{border-color:#58a6ff}
  #rules{width:min(520px,92vw);font-size:.95rem;line-height:1.9}
  .rule{color:#ff5c5c}.rule.ok{color:#3cff5e}
  #say{min-height:26px;color:#ffd23e;text-align:center}
</style>
</head>
<body>
<h1>PASSWORD CREATOR 2000</h1>
<input id="pw" placeholder="create a password..." autocomplete="off" spellcheck="false">
<div id="rules"></div>
<div id="say">the requirements grow over time. like a horror movie.</div>
<script>
const pw=document.getElementById('pw'),rulesEl=document.getElementById('rules'),say=document.getElementById('say');
const RULES=[
  {t:'at least 5 characters',f:v=>v.length>=5},
  {t:'must include the number 7',f:v=>v.includes('7')},
  {t:'must include a month of the year',f:v=>/jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec/i.test(v)},
  {t:'must include today\'s vibe: the word "sunday"',f:v=>/sunday/i.test(v)},
  {t:'roman numerals must multiply to exactly 100 (V x XX)',f:v=>{const m=v.match(/[ivxl]/gi)||[];return m.length>=2}},
  {t:'must contain the answer to life',f:v=>/42/.test(v)},
  {t:'must NOT contain the letter "e". yes really.',f:v=>!/e/i.test(v)}
];
let active=1,solved=false;
function check(){
  const v=pw.value;
  let okCount=0;
  rulesEl.innerHTML='';
  RULES.slice(0,active).forEach((r,i)=>{
    const ok=r.f(v);
    if(ok)okCount++;
    const d=document.createElement('div');
    d.className='rule'+(ok?' ok':'');
    d.textContent=(ok?'\u2713 ':'\u2717 ')+r.t;
    rulesEl.appendChild(d);
  });
  if(active<RULES.length&&okCount===active){active++;say('requirement added. because reasons.');}
  else if(active===RULES.length&&okCount===RULES.length&&!solved){
    solved=true;
    say('ERROR: password TOO STRONG. please weaken it.');
  }
}
pw.addEventListener('input',check);
check();
</script>
</body>
</html>
