<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICE CUBE VS HAIRDRYERS</title>
<style>

  html,body{margin:0;height:100%;background:#10101f;color:#eef;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  h1{font-size:.95rem;margin:0;text-align:center;color:#b9f6ca}
  button{padding:11px 20px;font-family:inherit;font-size:.98rem;border:3px solid #b9f6ca;background:#151530;color:#dfe8ff;cursor:pointer}
  button:disabled{opacity:.45}
  #say{min-height:28px;text-align:center;padding:0 10px}

</style>
</head>
<body>
<h1>ICE CUBE VS HAIRDRYERS</h1>
<canvas id="c" width="600" height="380" style="border:4px solid #f06292;background:#181830"></canvas>
<div id="hud">score 0</div>
<div id="say">arrows or mouse. grab mint leaves. avoid the hairdryers. you will fail eventually.</div>
<script>
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(d||.08));o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(d||.08));}catch(e){}};})();
const c=document.getElementById('c'),x=c.getContext('2d');
let px=280,score=0,got=0,t0=Date.now(),dead=false,haz=[],snacks=[];
addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();px=Math.max(16,Math.min(584,e.clientX-r.left));});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=24;if(e.key==='ArrowRight')px+=24;});
setInterval(()=>{if(dead)return;
  if(Math.random()<.055)haz.push({x:Math.random()*560+20,y:-20,v:2.2+Math.random()*1.6+(Date.now()-t0)/22000,k:Math.random()<.5});
  if(Math.random()<.022)snacks.push({x:Math.random()*560+20,y:-16,v:2});
},40);
setInterval(()=>{
  if(dead)return;
  x.clearRect(0,0,600,380);
  x.fillStyle='#b3e5fc';x.fillRect(px-18,320,36,26);
  x.font='bold 12px Consolas';x.textAlign='center';x.fillStyle='#fff';
  x.fillText('ICE CUBE',px,362);
  for(let hi=haz.length-1;hi>=0;hi--){
    const h=haz[hi];h.y+=h.v;
    x.fillStyle='#f06292';
    if(h.k)x.fillRect(h.x-10,h.y-14,20,28);else{x.beginPath();x.arc(h.x,h.y,11,0,7);x.fill();}
    if(h.y<395&&Math.abs(h.x-px)<27&&Math.abs(h.y-333)<27)return die();
    if(h.y>400)haz.splice(hi,1);
  }
  for(let si=snacks.length-1;si>=0;si--){
    const s=snacks[si];s.y+=s.v;
    x.fillStyle='#b9f6ca';x.beginPath();x.arc(s.x,s.y,8,0,7);x.fill();
    if(s.y<395&&Math.abs(s.x-px)<27&&Math.abs(s.y-330)<24){snacks.splice(si,1);got++;__beep(700,.07);}
    else if(s.y>400)snacks.splice(si,1);
  }
  score=Math.floor((Date.now()-t0)/100)*5+got*50;
  document.getElementById('hud').textContent='score '+score+' \u00B7 mint leaves: '+got;
},16);
function die(){
  dead=true;
  document.getElementById('say').innerHTML='the wind weapon is warm. so warm.'+'<br><br><button onclick="location.reload()">TRY AGAIN</button>';
}
</script>
</body>
</html>
