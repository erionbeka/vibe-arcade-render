<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE PATIENCE DOOR</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;color:#ccc;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;user-select:none;-webkit-user-select:none}
  h1{font-size:.95rem;color:#89b8dd;margin:0}
  #door{width:150px;height:220px;border:4px solid #556;background:#1a1a2c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:pointer}
  #btnx{padding:16px 26px;font-family:inherit;font-size:1rem;border:3px solid #ffd23e;background:#2a2413;color:#ffe600;cursor:pointer;border-radius:50%;width:110px;height:110px}
  #bar{width:min(320px,80vw);height:16px;border:3px solid #444;background:#111}
  #fill{height:100%;width:0%;background:#ffd23e}
  #say{min-height:48px;text-align:center;color:#b88;width:min(420px,90vw)}
</style>
</head>
<body>
<h1>THE PATIENCE DOOR</h1>
<div id="door"><button id="btnx">HOLD<br>60s</button></div>
<div id="bar"><div id="fill"></div></div>
<div id="say">hold the button for a full minute. release early = reset. there is definitely a door behind this door.</div>
<script>
let holding=false,p=0,broken=false;
const fill=document.getElementById('fill'),say=document.getElementById('say');
const INSULTS=['your thumb is cramping isn\'t it.','the door appreciates your suffering.','this is fine. everything is fine.','60 seconds is nothing. said no one.','we are having so much fun together.','the button is thinking about its ex.','almost... ish. not really.','i could open the door at any time. i choose drama.'];
document.getElementById('btnx').addEventListener('pointerdown',()=>holding=true);
addEventListener('pointerup',()=>holding=false);
setInterval(()=>{
  if(broken)return;
  if(holding){
    p+=100/600;
    fill.style.width=p+'%';
    if(((p*6)|0)%8===0)say(INSULTS[Math.floor(p/12.5)]);
    if(p%9<1)__beep(300+p*4,.03);
    if(p>=100){
      broken=true;
      say.innerHTML='<b style="color:#7dff8a">THE DOOR OPENS...</b><br><br>behind it: another door. and another. and eventually:<br><br><b style="color:#ffe600;font-size:1.2rem">there was never an exit. the patience WAS the exit.</b><br><br>you waited 60 seconds for philosophy.<br><br><span style="color:#888">achievement unlocked: gandalf tier patience \u00B7 <a href="#" onclick="location.reload()" style="color:#89b8dd">wait again?</a></span>';
      __beep(800,.2);__beep(1000,.3);
    }
  } else if(p>0&&p<100){
    broken=true;
    say.innerHTML='<span style="color:#ff5c5c">RELEASED AT '+p.toFixed(1)+'%.</span> the door sighs audibly.<br>all progress evaporated. like your commitment.<br><br><span style="color:#888"><a href="#" onclick="location.reload()" style="color:#89b8dd">try again, quitter (affectionate)</a></span>';
    __beep(140,.3,'sawtooth');
  }
},100);
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}};})();
</script>
</body>
</html>
