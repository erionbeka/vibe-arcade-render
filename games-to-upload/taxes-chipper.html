  for(let i=docs.length-1;i>=0;i--){

    x.strokeStyle='#b8ad93';x.strokeRect(-18,-13,36,26);
    x.fillStyle='#888';for(let l=-8;l<10;l+=5)x.fillRect(-12,l+4,24,2);
    x.restore();
    if(d.x>388&&!cv.__eaten){}
    if(d.x>388&&d.x<420){docs.splice(i,1);n++;document.getElementById('n').textContent=n;}
    else if(d.x>W)docs.splice(i,1);
  }
  x.fillStyle='#fff';x.font='bold 12px Consolas';
  x.fillText('click documents to shove them in faster',14,26);
  x.restore();
  requestAnimationFrame(draw);
})();
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}};})();
