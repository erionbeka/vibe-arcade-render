<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BEE HERDER</title>
<style>
  html,body{margin:0;height:100%;background:#1a1408;color:#fff7d6;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  h1{font-size:.95rem;color:#ffd23e;margin:0}
  canvas{border:4px solid #5c4a1a;background:linear-gradient(#2e4a1f,#1d3013);cursor:none;touch-action:none}
  #hud{display:flex;gap:22px;font-size:.95rem;color:#d6c98a}b{color:#ffe600}
  #say{min-height:24px;text-align:center;color:#ffe9a8;padding:0 10px}
</style>
</head>
<body>
<h1>BEE HERDER</h1>
<canvas id="c" width="640" height="380"></canvas>
<div id="hud"><span>HONEY <b id="honey">0%</b></span><span>BEES <b id="bees">6</b></span><span>LEVEL <b id="lvl">1</b></span></div>
<div id="say">move your cursor: bees follow the flower. hover near the hive to make honey. avoid wasps. obviously.</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=640,H=380;
let mx=W/2,my=H/2,honey=0,lvl=1,lost=0,t=0,msg='',msgT=0;
const bees=[],wasps=[];
for(let i=0;i<6;i++)bees.push({x:80+Math.random()*200,y:80+Math.random()*200,vx:0,vy:0,ph:Math.random()*7});
function say(t2){msg=t2;}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
setInterval(()=>{
  t++;
  // spawn wasps by level
  if(wasps.length<lvl&&t%180===0)wasps.push({x:W-40,y:40+Math.random()*(H-80),vx:-1,vy:0});
  for(const b of bees){
    const dx=mx-b.x,dy=my-b.y,d=Math.hypot(dx,dy)+.01;
    b.vx+=(dx/d)*.14+Math.sin(t*.11+b.ph)*.09;
    b.vy+=(dy/d)*.14+Math.cos(t*.13+b.ph)*.09;
    for(const w of wasps){
      const wx=b.x-w.x,wy=b.y-w.y,wd=Math.hypot(wx,wy);
      if(wd<90){b.vx+=wx/wd*1.1;b.vy+=wy/wd*1.1;}
      if(wd<12&&!b.cool){b.cool=true;b.x=-30;b.y=Math.random()*H;lost++;
        document.getElementById('bees').textContent=bees.filter(bb=>!bb.cool).length;
        __beep(130,.18,'sawtooth');say('A WASP GOT ONE. it will be avenged.');
        setTimeout(()=>{b.cool=false;b.x=60;b.y=60;document.getElementById('bees').textContent=bees.filter(bb=>!bb.cool).length;},4000);
      }
    }
    b.vx*=.92;b.vy*=.92;
    b.x+=b.vx;b.y+=b.vy;
    b.x=Math.max(8,Math.min(W-8,b.x));b.y=Math.max(8,Math.min(H-8,b.y));
  }
  // honey when >=3 bees near hive
  const inside=bees.filter(b=>!b.cool&&b.x>W-90&&b.y>120&&b.y<260).length;
  if(inside>=3){
    honey+=inside*.15;
    document.getElementById('honey').textContent=Math.min(100,Math.round(honey))+'%';
    if(honey>=100){
      honey=0;lvl++;document.getElementById('honey').textContent='0%';document.getElementById('lvl').textContent=lvl;
      say('JAR FILLED! level '+lvl+'. the wasps heard about your success.');
      __beep(700,.15);__beep(900,.2);
    }
  }
  for(const w of wasps){
    let tgt=null,best=1e9;
    for(const b of bees){if(b.cool)continue;const d=(b.x-w.x)**2+(b.y-w.y)**2;if(d<best){best=d;tgt=b;}}
    if(tgt){w.vx+=((tgt.x-w.x)/Math.sqrt(best))*0.06;w.vy+=((tgt.y-w.y)/Math.sqrt(best))*0.06;}
    w.vx*=.985;w.vy*=.985;w.x+=w.vx;w.y+=w.vy;
    if(w.x<10||w.x>W-10)w.vx*=-1;if(w.y<10||w.y>H-10)w.vy*=-1;
  }
},16);
(function draw(){
  x.clearRect(0,0,W,H);
  x.fillStyle='#e8b04b';x.fillRect(W-70,110,60,160);
  x.fillStyle='#8a5a20';x.beginPath();x.arc(W-40,190,17,0,7);x.fill();
  x.fillStyle='#1d1408';for(let j=118;j<262;j+=22)x.fillRect(W-70,j,60,4);
  x.fillStyle='#ff9de2';x.beginPath();x.arc(mx,my,10,0,7);x.fill();
  x.fillStyle='#ffe600';for(let p=0;p<5;p++){const a=p/5*6.28;x.beginPath();x.ellipse(mx+Math.cos(a)*13,my+Math.sin(a)*13,6,3,a,0,7);x.fill();}
  for(const b of bees){
    if(b.cool)continue;
    x.save();x.translate(b.x,b.y);x.rotate(Math.atan2(b.vy,b.vx));
    x.fillStyle='#ffd23e';x.beginPath();x.ellipse(0,0,9,6,0,0,7);x.fill();
    x.fillStyle='#111';x.fillRect(-4,-5,3,10);x.fillRect(1,-5,3,10);
    x.fillStyle='rgba(255,255,255,.7)';
    const w=Math.sin(Date.now()/25+b.ph)*5;
    x.beginPath();x.ellipse(-2,-7+w/2,5,2,-.5,0,7);x.fill();
    x.restore();
  }
  for(const w of wasps){
    x.save();x.translate(w.x,w.y);
    x.fillStyle='#7a1f27';x.beginPath();x.ellipse(0,0,10,5,0,0,7);x.fill();
    x.fillStyle='#ffd23e';x.fillRect(-3,-4,2,8);x.fillRect(2,-4,2,8);
    x.restore();
  }
  x.fillStyle='#ffe600';x.font='bold 15px Consolas';
  if(msgT-->0||msg){x.textAlign='center';x.fillText(msg,W/2,34);x.textAlign='left';if(msgT<=0)msg='';}
  requestAnimationFrame(draw);
})();
setInterval(()=>{if(msgT<=0)msg='';},50);
(function(){window.__beep=function(f,d,t2){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t2||'square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}};})();
</script>
</body>
</html>
