<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POPCORN WATCH</title>
<style>

  html,body{margin:0;height:100%;background:#0c1020;color:#eef;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  h1{font-size:.95rem;margin:0;text-align:center;color:#ffe600}
  button{padding:11px 20px;font-family:inherit;font-size:.98rem;border:3px solid #ffe600;background:#151530;color:#dfe8ff;cursor:pointer}
  button:disabled{opacity:.45}
  #say{min-height:28px;text-align:center;padding:0 10px}

</style>
</head>
<body>
<h1>POPCORN WATCH</h1>
<button id="zone" style="width:min(480px,88vw);height:200px;font-size:1.5rem;font-family:inherit;border:4px solid #ffe600;color:#fff">BEGIN (3 rounds)</button>
<div id="bestEl">best this session: --</div>
<div id="say">click when you see "POP". early clicks are publicly mocked.</div>
<script>
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(d||.08));o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(d||.08));}catch(e){}};})();
let state='idle',goTime=0,best=null,total=0;
const b=document.getElementById('zone');
b.addEventListener('pointerdown',()=>{
  if(state==='idle')begin();
  else if(state==='wait')early();
  else hit();
});
function begin(){
  state='wait';b.style.background='#3a1c1c';b.textContent='heating...';
  document.getElementById('say').textContent='hold... hold...';
  setTimeout(()=>{
    if(state!=='wait')return;
    state='go';goTime=Date.now();
    b.style.background='#ffe600';b.textContent='POP!';
    __beep(900,.09);
  },1400+Math.random()*2600);
}
function early(){
  state='idle';b.style.background='#33121f';b.textContent='too soon.';
  document.getElementById('say').textContent='that was just the microwave humming.';
  setTimeout(begin,1600);
}
function hit(){
  const ms=Date.now()-goTime;total++;
  if(best===null||ms<best)best=ms;
  document.getElementById('bestEl').textContent='best this session: '+best+'ms';
  state='idle';b.style.background='#1c2333';
  if(total>=3){
    b.textContent='DONE.';
    b.textContent='DONE. verdict: '+rank(best);
    document.getElementById('say').textContent='best '+best+'ms across 3 rounds. '+rank(best);
    total=0;setTimeout(()=>{b.textContent='BEGIN NEW TRIALS';state='idle';},1600);
    return;
  }
  b.textContent='AGAIN ('+(3-total)+' left)';
  setTimeout(()=>{if(state==='idle')begin();},1200);
}
function rank(ms){return ms<250?'CERTIFIED QUICK.':ms<400?'respectable.':ms<700?'your ancestor was a sloth.':'did you leave?';}
</script>
</body>
</html>
