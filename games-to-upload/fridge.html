<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FRIDGE SIMULATOR</title>
<style>
  html,body{margin:0;height:100%;background:#101418;color:#e8f1f5;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  h1{font-size:.95rem;color:#8fd3ff;margin:0}
  #fridge{position:relative;width:220px;height:320px;background:#c9d6dd;border-radius:12px;border:4px solid #55636b}
  #door{position:absolute;inset:0;background:linear-gradient(#e8f0f4,#bccbd3);border-radius:10px;transform-origin:left;transition:transform .5s cubic-bezier(.7,0,.3,1);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #door.open{transform:perspective(700px) rotateY(-105deg)}
  #handle{position:absolute;right:14px;top:130px;width:12px;height:60px;background:#55636b;border-radius:6px}
  #light{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#333;transition:.3s}
  #light.on{background:#fff59e;box-shadow:0 0 24px #fff59e}
  #inv{min-height:96px;width:min(480px,90vw);text-align:center;font-size:1.05rem;color:#b8cbd6;padding:0 10px}
  #count{color:#667}
</style>
</head>
<body>
<h1>FRIDGE SIMULATOR</h1>
<div id="fridge">
  <div id="door"><div id="handle"></div><span style="font-size:.8rem;color:#789">open me</span></div>
  <div id="light"></div>
</div>
<div id="inv">inside there is a light. and mysteries.</div>
<div id="count">opens: 0 &middot; mysteries found: 0/12</div>
<script>
let opens=0,found=new Set();
const door=document.getElementById('door'),light=document.getElementById('light'),inv=document.getElementById('inv');
const BASE=['three (3) condiments of unknown origin','half an onion wrapped in increasingly tight plastic','yogurt, sealed since antiquity'];
const EVENTS=[
  ['the yogurt has developed opinions. strong ones.','yogurt'],
  ['there is more ham than before. nobody added ham.','ham'],
  ['a single pea rolls out and stops at your feet. it nods.','pea'],
  ['the leftovers have fused into one entity. it is called "stew" now.','stew'],
  ['the butter is on the wrong shelf. this is someone\'s message.','butter'],
  ['you find the missing sock. the mystery deepens.','sock'],
  ['the milk has turned. it now identifies as cheese. respect its journey.','milk'],
  ['behind everything: a pizza box. empty. a memorial.','box'],
  ['the jam is fermenting into something louder.','jam'],
  ['a cat is in here. it was not invited. it declines to leave.','cat'],
  ['freezer frost has formed a tiny, perfect replica of your house.','frost'],
  ['at the very back: a light snack from a previous tenant. dated 1994.','snack']
];
const seen=new Set();
door.addEventListener('click',()=>{
  const opening=!door.classList.contains('open');
  door.classList.toggle('open');
  light.classList.toggle('on',opening);
  if(!opening){inv.textContent='the fridge rests.';return;}
  opens++;
  let text;
  if(opens===1)text='cold air. the hum of a hardworking appliance. respect.';
  else if(Math.random()<.45&&seen.size<EVENTS.length){
    let e;do{e=EVENTS[Math.floor(Math.random()*EVENTS.length)];}while(seen.has(e[1]));
    seen.add(e[1]);text=e[0];
  }else text=BASE[Math.floor(Math.random()*BASE.length)];
  inv.textContent=text+' (day '+Math.floor(opens/2+1)+' of owning this fridge)';
  document.getElementById('count').textContent='opens: '+opens+' \u00B7 mysteries found: '+seen.size+'/12';
});
</script>
</body>
</html>
