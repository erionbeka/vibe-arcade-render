<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BUS STOP PHILOSOPHER</title>
<style>

  html,body{margin:0;height:100%;background:#111318;color:#eef;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  h1{font-size:.95rem;margin:0;text-align:center;color:#7fd1ff}
  button{padding:11px 20px;font-family:inherit;font-size:.98rem;border:3px solid #7fd1ff;background:#151530;color:#dfe8ff;cursor:pointer}
  button:disabled{opacity:.45}
  #say{min-height:28px;text-align:center;padding:0 10px}

</style>
</head>
<body>
<h1>BUS STOP PHILOSOPHER</h1>
<button id="act" style="font-size:1.1rem">CHECK SCHEDULE</button>
<div id="inv" style="min-height:56px;width:min(460px,90vw);text-align:center;color:#cfd8e3">the bus arrives eventually. philosophically.</div>
<div id="cnt">cycles: 0 · discoveries: 0/8</div>
<script>
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(d||.08));o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(d||.08));}catch(e){}};})();
let opens=0;const seen=new Set();
const EVENTS=[["bus arrives as 3 people leave. tragic theater","bus"],["someone stands too close to the edge","edge"],["pigeon audits your snack","pigeon"],["schedule updates to \"soon\"","soon"],["two buses arrive together after 40 min","twin"],["person asks if bus came. it did not","asker"],["your bus is out of service visually","oops"],["you walked. bus passed you smiling","walk"]];
document.getElementById('act').addEventListener('click',()=>{
  opens++;
  const inv=document.getElementById('inv');
  if(opens===1){inv.textContent='timetable says 4 minutes. believe.';__beep(600,.07);}
  else if(seen.size<EVENTS.length&&Math.random()<.62){
    let e;do{e=EVENTS[Math.floor(Math.random()*EVENTS.length)];}while(seen.has(e[1]));
    seen.add(e[1]);inv.textContent=e[0];__beep(800,.06);
  }else inv.textContent='the bus arrives eventually. philosophically.';
  document.getElementById('cnt').textContent='cycles: '+opens+' \u00B7 discoveries: '+seen.size+'/8';
  if(seen.size===EVENTS.length)inv.textContent+=' \u2014 YOU HAVE SEEN IT ALL.';
});
</script>
</body>
</html>
