<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOOD RING</title>
<style>
  html,body{margin:0;height:100%;background:#14101f;color:#efe8ff;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  h1{font-size:.95rem;color:#c4b5fd;margin:0}
  #ring{width:170px;height:170px;border-radius:50%;border:16px solid #6d28d9;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:#1b1233;transition:border-color .6s}
  button{padding:13px 26px;font-family:inherit;font-size:1.05rem;border:3px solid #8b5cf6;background:#241a4d;color:#d6c7ff;cursor:pointer}
  button:hover{background:#33246e}
  #result{min-height:34px;font-size:1.35rem;color:#ffe600;text-align:center;padding:0 10px}
  #hist{color:#776b9c;font-size:.85rem;max-height:80px;overflow:hidden;text-align:center;width:min(420px,90vw)}
</style>
</head>
<body>
<h1>MOOD RING</h1>
<div id="ring">?</div>
<button id="go">CONSULT THE RING</button>
<div id="result">the ring knows you. probably too well.</div>
<div id="hist"></div>
<script>
const ring=document.getElementById('ring'),res=document.getElementById('result'),hist=document.getElementById('hist');
const MOODS=[
  ['soup','\u{1F372}','#e8a13c'],['legally tired','\u{1F4A4}','#5c6bc0'],
  ['crunchy','\u{1F950}','#a1887f'],['one bad day from raccoon','\u{1F99D}','#78847a'],
  ['feral but polite','\u{1F438}','#66bb6a'],['moist (emotionally)','\u{1F4A7}','#4fc3f7'],
  ['goblin mode: lite','\u{1F47A}','#8d6e63'],['running on spite','\u{1F525}','#ef5350'],
  ['beige','\u{1F3E2}','#cbc0ab'],'',''
];
MOODS[9]=['vibrating at a frequency only dogs hear','\u{1F415}','#b39ddb'];
MOODS[10]=['fine (derogatory)','\u{1F610}','#90a4ae'];
document.getElementById('go').addEventListener('click',()=>{
  const m=MOODS[Math.floor(Math.random()*MOODS.length)];
  ring.style.borderColor=m[2];ring.textContent=m[1];
  res.innerHTML='your mood is: <b>'+m[0]+'</b>';
  const line='\u2022 '+m[0];
  hist.innerHTML=(line+'<br>'+hist.innerHTML).split('<br>').slice(0,4).join('<br>');
});
</script>
</body>
</html>
