<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROVE YOU ARE HUMAN</title>
<style>
  html,body{margin:0;height:100%;background:#f9f9f9;color:#222;font-family:'Segoe UI',Consolas,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .box{width:min(420px,90vw);border:1px solid #d3d3d3;background:#fff;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  h2{font-size:1rem;margin:0 0 4px;color:#333;font-weight:600}
  p{font-size:.85rem;margin:0 0 14px;color:#666}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:#eee;cursor:pointer;border:3px solid transparent;user-select:none}
  .cell.sel{border-color:#0d6efd;background:#e2ecff}
  button{margin-top:14px;padding:9px 18px;border:0;background:#0d6efd;color:#fff;border-radius:4px;cursor:pointer;font-size:.9rem}
  #msg{min-height:22px;font-size:.88rem;color:#c00;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h2 id="q">Select all squares with...</h2>
  <p id="sub">to prove you are human.</p>
  <div id="grid"></div>
  <button id="verify">VERIFY</button>
  <div id="msg"></div>
</div>
<script>
const EMO=['\u{1F34C}','\u{1F697}','\u{1F6A6}','\u{1F354}','\u{1F4A8}','\u{1F4B8}','\u{1F9CA}','\u{1F4AB}','\u{1F41D}','\u{1F33B}','\u{1F9EA}','\u{1F381}'];
const CHALLENGES=[
 {q:'Select all squares with VIBES',ok:['\u{1F4A8}','\u{1F4AB}','\u{1F381}']},
 {q:'Select all squares containing EMOTIONAL DAMAGE',ok:['\u{1F4B8}','\u{1F9CA}','\u{1F33B}']},
 {q:'Select all squares that have ever lied to you',ok:['\u{1F697}','\u{1F354}','\u{1F41D}']},
 {q:'Select all squares your mother would approve of',ok:['\u{1F33B}','\u{1F9EA}','\u{1F34C}']}
];
let round=0,sel=new Set();
function render(){
  const ch=CHALLENGES[round%CHALLENGES.length];
  sel.clear();
  document.getElementById('q').textContent=ch.q;
  const g=document.getElementById('grid');g.innerHTML='';
  const cells=[...ch.ok,...EMO.filter(e=>!ch.ok.includes(e))].sort(()=>Math.random()-.5).slice(0,9);
  cells.forEach(e=>{
    const d=document.createElement('div');d.className='cell';d.textContent=e;
    d.addEventListener('click',()=>{d.classList.toggle('sel');sel.has(e)?sel.delete(e):sel.add(e);});
    g.appendChild(d);
  });
  document.getElementById('verify').onclick=()=>{
    const correct=ch.ok.every(o=>sel.has(o))&&sel.size===ch.ok.length;
    if(correct){
      round++;
      if(round>=CHALLENGES.length){
        document.querySelector('.box').innerHTML='<h2 style="text-align:left">Verification complete!</h2><p style="font-size:.95rem;line-height:1.6;color:#333">Humanity confirmed at '+new Date().toLocaleTimeString()+'.<br><br>This certificate expires in 4 minutes.<br><br><button onclick="location.reload()">re-prove existence</button></p>';
      } else {document.getElementById('msg').style.color='green';document.getElementById('msg').textContent='suspiciously human. one more.';setTimeout(render,900);}
    } else {
      document.getElementById('msg').textContent=pick(['incorrect. bots usually do better.','hm. that is exactly what a toaster would pick.','wrong. also, bold.','our records disagree with your entire life.']);
      __beep(150,.15,'sawtooth');
    }
  };
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
render();
(function(){window.__beep=function(f,d,t){try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}};})();
</script>
</body>
</html>
